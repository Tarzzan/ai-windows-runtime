name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Lint
        run: ruff check .
      - name: Test
        run: pytest -q
      - name: Runtime Core Tests
        run: cargo test --manifest-path runtime-core/Cargo.toml
      - name: Runtime Core Smoke
        run: bash scripts/runtime-core-smoke.sh
      - name: Full Artifact Pipeline
        run: bash scripts/run-full-pipeline.sh out
