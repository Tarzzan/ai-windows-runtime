[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-windows-runtime"
version = "0.1.0"
description = "AI-assisted Windows compatibility runtime tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
compat-trace = "compat_runtime.trace_collector.cli:main"
compat-gaps = "compat_runtime.gap_detector.cli:main"
compat-plan = "compat_runtime.patch_orchestrator.cli:main"
compat-validate = "compat_runtime.schema_validator.cli:main"
compat-report = "compat_runtime.reporting.cli:main"
compat-trend = "compat_runtime.trend_report.cli:main"
compat-kpi = "compat_runtime.kpi_tracker.cli:main"
compat-release-readiness = "compat_runtime.release_readiness.cli:main"
compat-productization = "compat_runtime.productization.cli:main"
compat-repro-package = "compat_runtime.repro_package.cli:main"
compat-root-cause = "compat_runtime.root_cause.cli:main"
compat-plan-diff = "compat_runtime.patch_plan_diff.cli:main"
compat-proposal-provenance = "compat_runtime.proposal_provenance.cli:main"
compat-test-impact = "compat_runtime.test_impact.cli:main"
compat-rollback-hints = "compat_runtime.rollback_hints.cli:main"
compat-review-checklist = "compat_runtime.proposal_review_checklist.cli:main"
compat-template-catalog = "compat_runtime.patch_template_library.cli:main"
compat-proposal-risk = "compat_runtime.proposal_risk.cli:main"
compat-crash-signatures = "compat_runtime.crash_signatures.cli:main"
compat-installer-phases = "compat_runtime.installer_phases.cli:main"
compat-quality-gate = "compat_runtime.quality_gate.cli:main"
compat-release-decision = "compat_runtime.release_decision.cli:main"
compat-runtime-signals = "compat_runtime.runtime_signals.cli:main"
compat-hook-backlog = "compat_runtime.hook_backlog.cli:main"
compat-iteration-plan = "compat_runtime.iteration_plan.cli:main"
compat-release-forecast = "compat_runtime.release_forecast.cli:main"
compat-readiness-scorecard = "compat_runtime.readiness_scorecard.cli:main"
compat-execution-burndown = "compat_runtime.execution_burndown.cli:main"
compat-validation-command-pack = "compat_runtime.validation_command_pack.cli:main"
compat-risk-watchlist = "compat_runtime.risk_watchlist.cli:main"
compat-release-gate-history = "compat_runtime.release_gate_history.cli:main"
compat-pilot-readiness = "compat_runtime.pilot_readiness.cli:main"
compat-ownership-assignment = "compat_runtime.ownership_assignment.cli:main"
compat-remediation-sprint = "compat_runtime.remediation_sprint.cli:main"
compat-release-brief = "compat_runtime.release_brief.cli:main"
compat-rollout-guardrails = "compat_runtime.rollout_guardrails.cli:main"
compat-artifact-health = "compat_runtime.artifact_health.cli:main"
compat-delivery-cockpit = "compat_runtime.delivery_cockpit.cli:main"
compat-stakeholder-update = "compat_runtime.stakeholder_update.cli:main"
compat-handoff-checklist = "compat_runtime.handoff_checklist.cli:main"
compat-validation-coverage = "compat_runtime.validation_coverage.cli:main"
compat-launch-readiness = "compat_runtime.launch_readiness.cli:main"
compat-release-packet = "compat_runtime.release_packet.cli:main"
compat-ops-runbook = "compat_runtime.ops_runbook.cli:main"
compat-dependency-watch = "compat_runtime.dependency_watch.cli:main"
compat-readiness-delta = "compat_runtime.readiness_delta.cli:main"
compat-delivery-signoff = "compat_runtime.delivery_signoff.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
