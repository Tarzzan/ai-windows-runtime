[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-windows-runtime"
version = "0.1.0"
description = "AI-assisted Windows compatibility runtime tooling"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
compat-trace = "compat_runtime.trace_collector.cli:main"
compat-gaps = "compat_runtime.gap_detector.cli:main"
compat-plan = "compat_runtime.patch_orchestrator.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
